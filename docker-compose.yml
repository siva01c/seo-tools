services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: metadata-crawler-app
    # Runs as root so the bind-mounted ./storage (owned by the host user) stays writable
    # regardless of the host UID. The production image (Dockerfile final stage) runs as the
    # non-root `seobot` user.
    user: '0'
    network_mode: 'host'
    env_file:
      - .env
    environment:
      APIFY_LOCAL_STORAGE_DIR: /home/seobot/storage
    volumes:
      - ./storage:/home/seobot/storage
      - ./config:/home/seobot/config
      - ./scripts:/home/seobot/scripts
      - ./src:/home/seobot/src
      - ./ai:/home/seobot/ai
      - ./jest.config.js:/home/seobot/jest.config.js
      - ./eslint.config.js:/home/seobot/eslint.config.js
      - ./.prettierrc.js:/home/seobot/.prettierrc.js
      - ./.prettierignore:/home/seobot/.prettierignore
      - ./tsconfig.json:/home/seobot/tsconfig.json
      - ./tsconfig.test.json:/home/seobot/tsconfig.test.json
    command: ['sleep', 'infinity']

  typecheck:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ['tools']
    env_file:
      - .env
    volumes:
      - ./storage:/home/seobot/storage
    command: npx tsc --noEmit

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles: ['tools']
    env_file:
      - .env
    volumes:
      - ./storage:/home/seobot/storage

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: seo-tools-mcp
    env_file:
      - .env
    environment:
      # Production posture by default: mcp-server.ts refuses to start without SEO_MCP_TOKEN when
      # NODE_ENV=production. That is deliberate for a service that listens on a socket — generate
      # a token (`openssl rand -hex 24`, see .env.example) rather than relaxing this.
      NODE_ENV: 'production'
      NODE_OPTIONS: '--max-old-space-size=1024'
      APIFY_LOCAL_STORAGE_DIR: /home/seobot/storage
      MCP_PORT: '3000'
      FRONTEND_DIR: /home/seobot/frontend/public
      # Crawlee sizes its autoscaling budget from total host RAM, and each crawl child process
      # does so independently — it has no idea a sibling crawl is running. With
      # SEO_MAX_CONCURRENT_CRAWLS=2 that doubles the assumed budget against a single container
      # limit. Pin it so concurrent crawls stay inside the limit below and the autoscaler
      # throttles before the cgroup OOM killer has to.
      CRAWLEE_MEMORY_MBYTES: '512'
    volumes:
      - ./storage:/home/seobot/storage
      # Read-only so crawler.yml changes need only `docker compose restart mcp`, not an image
      # rebuild. configService reads process.cwd()/config/crawler.yml and nothing writes back
      # into config/ — the rate limiter persists to ./storage/rate-limiting/ instead.
      - ./config:/home/seobot/config:ro
      # Static files served alongside the API. Point SEO_FRONTEND_DIR at your own build output
      # if you have one; the default is an empty directory inside the repo, which simply 404s.
      - ${SEO_FRONTEND_DIR:-./storage/frontend}:/home/seobot/frontend/public:ro
    ports:
      # Localhost only. clientIp() in mcp-server.ts trusts X-Forwarded-For, so this port must be
      # reachable only by a trusted reverse proxy that overwrites that header; publishing it on
      # 0.0.0.0 would let anyone forge it and defeat all per-IP rate limiting (ASVS 4.1.3).
      # A deployment that fronts this with a proxy supplies its own compose overlay.
      - '127.0.0.1:3001:3000'
    # xvfb provides a display for crawls that retry with a visible browser
    command: ['sh', '-c', './start_xvfb_and_run_cmd.sh && node dist/src/mcp-server.js']
    restart: unless-stopped
    # Sized so two concurrent crawls fit with headroom: a measured crawl costs ~270-330 MB on top
    # of a ~40 MB idle container. The cap matters more than the headroom — on a small host the
    # OOM killer picks the largest RSS on the box, which may well be an unrelated service.
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

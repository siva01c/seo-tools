services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: metadata-crawler-app
    # Runs as root so the bind-mounted ./storage (owned by the host user) stays writable
    # regardless of the host UID. The production image (Dockerfile final stage) runs as the
    # non-root `seobot` user.
    user: '0'
    network_mode: 'host'
    env_file:
      - .env
    environment:
      APIFY_LOCAL_STORAGE_DIR: /home/seobot/storage
    volumes:
      - ./storage:/home/seobot/storage
      - ./config:/home/seobot/config
      - ./scripts:/home/seobot/scripts
      - ./src:/home/seobot/src
      - ./ai:/home/seobot/ai
      - ./jest.config.js:/home/seobot/jest.config.js
      - ./eslint.config.js:/home/seobot/eslint.config.js
      - ./.prettierrc.js:/home/seobot/.prettierrc.js
      - ./.prettierignore:/home/seobot/.prettierignore
      - ./tsconfig.json:/home/seobot/tsconfig.json
      - ./tsconfig.test.json:/home/seobot/tsconfig.test.json
    command: ['sleep', 'infinity']

  typecheck:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ['tools']
    env_file:
      - .env
    volumes:
      - ./storage:/home/seobot/storage
    command: npx tsc --noEmit

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles: ['tools']
    env_file:
      - .env
    volumes:
      - ./storage:/home/seobot/storage

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: seo-tools-mcp
    env_file:
      - ../.env.shared
      - .env
    environment:
      NODE_ENV: 'production'
      NODE_OPTIONS: '--max-old-space-size=1024'
      APIFY_LOCAL_STORAGE_DIR: /home/seobot/storage
      MCP_PORT: '3000'
      FRONTEND_DIR: '/home/seobot/frontend/public'
      VIRTUAL_HOST: 'seo.ludekkvapil.cz,seo.local'
      LETSENCRYPT_HOST: 'seo.ludekkvapil.cz'
      VIRTUAL_PORT: '3000'
      VIRTUAL_PROTO: 'http'
      VIRTUAL_NETWORK: 'agentic-ops'
      HTTPS_METHOD: 'noredirect'
      # Crawlee sizes its autoscaling budget from host RAM (25% = 1 GB on this 4 GB box) and
      # each crawl child process does so independently — it has no idea a sibling crawl is
      # running. With SEO_MAX_CONCURRENT_CRAWLS=2 that means 2 GB of assumed budget against a
      # 1.5 G container limit. Pin it so two crawls together stay under the limit and the
      # autoscaler throttles concurrency before the cgroup OOM killer has to.
      CRAWLEE_MEMORY_MBYTES: '512'
    volumes:
      - ./storage:/home/seobot/storage
      # Mounted read-only so crawler.yml changes need only `docker compose restart mcp`, not a
      # full image rebuild (npm ci + tsc is painful on a 4 GB VPS with no swap). configService
      # reads process.cwd()/config/crawler.yml and nothing writes back into config/ — the
      # rate limiter persists to ./storage/rate-limiting/ instead.
      - ./config:/home/seobot/config:ro
      # config_seo.toml publishes here (publishDir = "public/seo"); mount just the SEO
      # subsite, not the whole portfolio public/ tree, so unrelated pages aren't served.
      - ../ludekkvapil/public/seo:/home/seobot/frontend/public:ro
    ports:
      # Bound to localhost only: public traffic must go through ops-proxy on the agentic-ops
      # network, which is the only party allowed to set X-Forwarded-For (see clientIp() in
      # mcp-server.ts). Publishing this on 0.0.0.0 would let anyone bypass the proxy and forge
      # that header directly, defeating all per-IP rate limiting (ASVS 4.1.3).
      - '127.0.0.1:3001:3000'
    # xvfb provides a display for crawls that retry with a visible browser
    command: ['sh', '-c', './start_xvfb_and_run_cmd.sh && node dist/src/mcp-server.js']
    restart: unless-stopped
    # Sized against the host, not against what a crawl might want: the VPS is a 4 GB LXC with
    # no swap and ~1.7 GB free, so a 2.5 G limit would never be reached — the host OOM killer
    # fires first and picks the largest RSS on the box (a neighbouring MySQL), not the crawler.
    # A measured crawl costs ~270-330 MB on top of a ~40 MB idle container, so 1.5 G leaves
    # room for two concurrent crawls while still capping the blast radius.
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M
    networks:
      - agentic-ops

networks:
  agentic-ops:
    external: true
